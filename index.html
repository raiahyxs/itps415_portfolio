<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rhealyn Vasquez — graphic designer, web developer, and cloud engineer. A portfolio at the intersection of creativity and technology." />
    <meta name="theme-color" content="#101210" />
    <script>
      try {
        const theme = localStorage.getItem('rv-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>Rhealyn Vasquez — Design. Develop. Deploy.</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
